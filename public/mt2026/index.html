<!doctype html>
<!-- Short-link redirect: /mt2026 → Quicket event page for Muslimah Today 2026.
     Lowercase twin of /MT2026 — GitHub Pages is case-sensitive, so each casing
     needs its own directory. Both point directly at Quicket (no chained hop).
     Lives in public/ (copied verbatim to dist/mt2026/) so it ships in the
     deployed GitHub Pages output untouched by Astro's route processing.
     Target is an absolute external URL, so base-path handling doesn't apply. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Muslimah Today 2026 tickets</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.quicket.co.za/events/384264-muslimah-today-2026/">
<meta http-equiv="refresh" content="0; url=https://www.quicket.co.za/events/384264-muslimah-today-2026/">
<script>
  location.replace("https://www.quicket.co.za/events/384264-muslimah-today-2026/");
</script>
</head>
<body>
<p>Redirecting you to the Muslimah Today 2026 tickets page …</p>
<p>If you're not redirected, <a href="https://www.quicket.co.za/events/384264-muslimah-today-2026/">click here</a>.</p>
</body>
</html>
